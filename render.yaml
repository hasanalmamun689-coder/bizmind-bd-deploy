# Render Blueprint — creates the BizMind BD API from this repo.
# Dashboard: New + > Blueprint > pick this GitHub repo.
services:
  - type: web
    name: bizmind-bd-api
    runtime: python
    region: singapore           # closest Render region to Bangladesh
    plan: free                  # change to "starter" to avoid sleep/cold starts
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Migrations run on every start; "alembic upgrade head" is a no-op when up to date.
    startCommand: alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL        # paste your Neon connection string in the Render dashboard
        sync: false
      - key: JWT_SECRET          # generated once by Render; never committed
        generateValue: true
      - key: CORS_ORIGINS        # your Vercel URL, e.g. https://bizmind-bd.vercel.app
        sync: false
      - key: CORS_ORIGIN_REGEX   # optional: allow Vercel preview URLs
        value: ""
      - key: AI_PROVIDER         # "none" works with no API key; "anthropic" enables Claude
        value: none
      - key: AI_API_KEY
        sync: false
      - key: AI_MODEL
        value: ""
